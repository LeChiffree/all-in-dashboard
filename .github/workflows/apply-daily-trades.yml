name: Apply daily trades metric

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-daily-trades.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add daily trades metric
        run: python3 tools/add_daily_trade_metric.py
      - name: Commit dashboard update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          git diff --cached --quiet || git commit -m "feat: show average trades per day"
          git push
